<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <script defer src="rps.js"></script>
    <link rel="stylesheet" href="rps.css">
</head>
<body>
    <p class="title">Welcome to Rock Paper Scissors Game</p>

    <button class="move-button" id="rock"><img src="images/rock-emoji.png" class="move-icon"></button>
    <button class="move-button" id="paper"><img src="images/paper-emoji.png" class="move-icon"></button>
    <button class="move-button" id="scissors"><img src="images/scissors-emoji.png" class="move-icon"></button>
    <p class="js-result result"></p>
    <p class='js-moves'></p>
    <p class='js-score score'></p>
    <button id="resetScore" class="reset-score-button">Reset Score</button>
</body>
</html>
