        // relembrando que arrays são referencias de memoria
        // então, ele é tipo um ponteiro que guarda o endereço dos itens dentro dele
        const array1 = [1,2,3];
        const array2 = array1.slice(); // agora cria uma cópia dos numeros, logo, um vetor diferente
        array2.push(4);
        console.log(array1);
        console.log(array2);
        // se n tivesse o slice, eles dariam na mesma

        // é possível aderir valores de variaveis diretamente (destructuring):
        const array3 = [1,2,3];
        const [firsValue, secondValue] = [array3[0], array3[2]];
        console.log(firsValue);
        console.log(secondValue);

        // LOOPS (continue and break)
        for (let i = 1; i <= 10; i ++) {
            if (i === 3) {
                continue; // skips 1 iteration
            }
            console.log(i);
            if (i === 8) {
                break; // exit a loop
            }
        }
