<!DOCTYPE html>
<html>
  <head></head>
  <body>
    <button onclick="playGame('heads')">heads</button>
    <button onclick="playGame('tails')">tails</button>

    <script>
        let score = JSON.parse(localStorage.getItem('score')) || {
            wins: 0,
            losses: 0
        }

        function playGame(PlayerCoin) {
        const randomNumber = Math.random();
        const result = randomNumber < 0.5 ? 'heads' : 'tails';
        if (PlayerCoin === result) {
            score.wins += 1;
        } else {
            score.losses += 1;
        }

        localStorage.setItem('score', JSON.stringify(score));
        console.log(PlayerCoin === result ? 'You win!' : 'You lose!');
        console.log(`Score: ${score.wins} wins, ${score.losses} losses`);
        }
      
    </script>
  </body>
</html>
