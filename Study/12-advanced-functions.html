<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Functions</title>
</head>
<body>
    
    <button class="js-button">CLICK</button>

    <script>

        const btnElement = document.querySelector('.js-button');
        // addEventListener() -> run some code when interacting with the element
        // First param is the event and the second is a function
        // For passing a function into another function we use arrow function
        const eventListener =  () => {
            console.log('click');
        }

        btnElement.addEventListener('click', eventListener);

        btnElement.removeEventListener('click', eventListener);

        /* No JavaScript, caso precisemos usar a função sem ela ser inicializada    como uma variavel, ou seja, normal: "function xx ()""
           Melhor utiliza-la nesse padrão normal, visto que em JS as funções podem ser chamadas no começo do programa, ou seja, onde quer que 
           voce escreva elas, elas já podem funcionar corretamente */

        // functions is a type of a variable, so::
        // This is an anonymous function (without a name), so we don't need a name if we're creating a function variable.
        const function1 = function() {
            console.log('hello');
        };

        console.log(function1);
        console.log(typeof function1);
        function1();

        // We can pass a function inside another
        function run(param) {
            param();
        }

        run(function(){
            console.log('hello2');
        });

        // setTimeout() allows us to run a function in the future (Asynchronous code)
        // First param is the function, second is milliseconds to wait for (1000 mil = 1 sec)
        setTimeout(function1, 3000);

        // will keep running the function
        setInterval(() => { console.log('interval');}, 3000)

        // ForEach executa uma função para cada elemento, passando o elemento e o index se quiser
        array = ["JS", "react", "three", "blender"];
        array.forEach(function(value, index) {
            console.log(value);
            console.log(index);
        });

        const regularFunction = function(param, param2) {
            console.log('sup');
            return 5;
        }

        const arrowFunction = (param, param2) => {
            console.log(param);
            return 5;
        }
        arrowFunction('sup');

        /* 
        forEach = faça algo 
        map = transforme
        filter = selecione
        */

        // .filter() ==> creates a new array []
        // if return true, put value in array, if return false, not put value in array;
        console.log([1, -3, 5].filter((value, index) => {
            return value >= 0;
        }));

        // .map() ==> creates a new array[] and whatever we return is added to new array -> transform an array into another array
        console.log([1,1,3].map((value, index) => {
            return value + 10;
        }))
        ;
        // console.log([1,1,3].map(value => value * 2));
        
        /* Closure:
        If a function has access to a value, it will always have access to that value
        */
        
    </script>
</body>
</html>
